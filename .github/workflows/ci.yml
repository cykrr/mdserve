name: ci

on:
  push:
    branches: [master, remote-fetch]
  pull_request:
    branches: [master]

jobs:
  hardened:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmd4c-dev libssl-dev clang pkg-config
          # Show what md4c libraries are available
          pkg-config --libs md4c-html md4c 2>/dev/null || true
          ls -la /usr/lib/x86_64-linux-gnu/libmd4c* 2>/dev/null || true

      - name: make hardened
        run: make hardened

      - name: make test
        run: make test

  analyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmd4c-dev libmd4c-html-dev libssl-dev clang-tools || \
            sudo apt-get install -y libmd4c-dev libssl-dev clang-tools

      - name: scan-build (our code only, mongoose is vendored)
        run: |
          scan-build --status-bugs gcc -Wall -Wextra -O2 -D_GNU_SOURCE -Iinclude -I. \
            -D_FORTIFY_SOURCE=2 -fstack-protector-strong \
            -DMG_ENABLE_DIRLIST=1 -DMG_ENABLE_IPV6=1 -DMG_TLS=MG_TLS_OPENSSL \
            -c main.c src/md.c src/membuf.c
